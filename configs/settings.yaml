project:
  name: "Hallucination Detection and Correction in LLMs using RAG"
  version: "0.2.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  chunks_dir: "data/chunks"
  chroma_dir: "db/chroma"
  outputs_dir: "outputs"
  runs_dir: "outputs/runs"
  predictions_dir: "outputs/predictions"
  reports_dir: "outputs/reports"
  figures_dir: "outputs/figures"

retrieval:
  collection_name: "rag_knowledge"
  chunk_size: 500
  chunk_overlap: 100
  top_k: 4
  claim_top_k: 3

detection:
  similarity_support_threshold: 0.55
  similarity_warning_threshold: 0.40
  nli_entailment_threshold: 0.60
  nli_contradiction_threshold: 0.60

generation:
  max_context_chunks: 4
  temperature: 0.2
  max_tokens: 512

ui:
  show_debug_info: true
